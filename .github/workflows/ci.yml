name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Pinned so the OS does not change under CI when `ubuntu-latest` moves to Ubuntu 26 (announced for
    # late 2026). Move on purpose, once Playwright supports the new image.
    runs-on: ubuntu-24.04
    # A normal run is about 11.5 minutes (the integration tests alone take about 8), so 15 left no room.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dealflow
          POSTGRES_PASSWORD: dealflow
          POSTGRES_DB: dealflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealflow -d dealflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://dealflow:dealflow@localhost:5432/dealflow
      DATABASE_MIGRATION_URL: postgresql://dealflow:dealflow@localhost:5432/dealflow
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production-use-only
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      EMAIL_FROM: ci@dealflow.test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SEC-10: a critical advisory in a production dependency blocks the build. High
      # findings are reviewed by hand (they currently sit in transitive packages that are
      # either build-time only or patched upstream within the last two weeks).
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=critical

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Migration check
        run: pnpm db:check

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      # TEST-02: the browser suite runs against the production build just made, on the
      # seeded demo data. The reset only touches this job's throwaway database.
      - name: Prepare demo data for E2E
        run: |
          pnpm db:migrate
          pnpm db:seed --reset

      # The invariants of orders, invoices and money, checked again from the data.
      - name: Reconcile
        run: pnpm reconcile

      # Normally 20 to 30 seconds. On 2026-11-05 the apt mirror served the font packages at about 1 minute
      # each and the step hung until the job was cancelled. The first try is cut at 4 minutes and repeated
      # once; apt keeps the packages it already fetched, so the second try is shorter.
      - name: Install Playwright browser
        timeout-minutes: 10
        run: timeout 240 pnpm exec playwright install --with-deps chromium || pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      # TEST-05: traces and screenshots from a failed run, kept for a week. They hold only
      # the synthetic demo data and test credentials, never real secrets.
      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
