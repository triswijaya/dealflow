services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow
      POSTGRES_DB: dealflow
    ports:
      # Host port 5433, not the default 5432, so another project's Postgres on 5432 cannot
      # silently answer for this one.
      - "5433:5432"
    volumes:
      - dealflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealflow -d dealflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dealflow_pgdata:
